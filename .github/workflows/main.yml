name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java (Motor Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flutter (Versión exacta para Flet 0.24.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Aceptar licencias de Android
        run: yes | flutter doctor --android-licenses

      - name: Instalar Flet
        run: pip install flet==0.24.1

      - name: Preparar plantilla compatible (Kotlin y dependencias)
        run: |
          git clone --branch 0.24.1 https://github.com/flet-dev/flet-build-template.git /tmp/flet-template
          cat << 'EOF' >> /tmp/flet-template/{{cookiecutter.out_dir}}/pubspec.yaml

          dependency_overrides:
            wakelock_plus: 1.2.5
            package_info_plus: 8.0.2
            sensors_plus: 6.0.1
            share_plus: 10.0.2
            connectivity_plus: 6.0.5
          EOF

      - name: Compilar APK
        run: flet build apk --template-dir /tmp/flet-template --verbose

      - name: Subir APK final
        uses: actions/upload-artifact@v4
        with:
          name: Control-Accesos-ERA
          path: build/apk/**/*.apk
