name: Build Android APK

on:
  workflow_dispatch: # Permite ejecutarlo a mano con un botón

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flutter (Motor gráfico de Flet)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Flet
        run: pip install flet==0.24.1

      - name: Compilar APK
        run: flet build apk

      - name: Subir APK final
        uses: actions/upload-artifact@v4
        with:
          name: Control-Accesos-ERA
          path: build/apk/**/*.apk
