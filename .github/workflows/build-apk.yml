name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java (Motor Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flutter (Versión exacta para Flet 0.24.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Aceptar licencias de Android
        run: yes | flutter doctor --android-licenses

      - name: Instalar Flet
        run: pip install flet==0.24.1

      - name: Parchear wakelock_plus 1.4.0 para Flutter 3.24.3
        run: |
          flutter pub cache add wakelock_plus -v 1.4.0
          find ~/.pub-cache -name "build.gradle" -path "*wakelock_plus*" -exec sed -i '/ndkVersion/d' {} +
          find ~/.pub-cache -name "build.gradle" -path "*wakelock_plus*" -exec sed -i 's/flutter.compileSdkVersion/34/g' {} +
          find ~/.pub-cache -name "build.gradle" -path "*wakelock_plus*" -exec sed -i 's/flutter.minSdkVersion/21/g' {} +
          find ~/.pub-cache -name "build.gradle" -path "*wakelock_plus*" -exec sed -i 's/flutter.targetSdkVersion/34/g' {} +

      - name: Compilar APK
        run: flet build apk --verbose

      - name: Subir APK final
        uses: actions/upload-artifact@v4
        with:
          name: Control-Accesos-ERA
          path: build/apk/**/*.apk
